<!DOCTYPE html>
<html>
	<head>
		<title>Rock Paper Scissors</title>
		<link rel="stylesheet" href="ultimate-RPS-game.css">
	</head>
	<body>
		<!-- algo
		1. computer randomly selects a move
		2. compare the moves to get a result
		3. update the score
		4. display the result in a popup
		-->
		<p class = "title">Rock Paper Scissors</p>

		<!-- picking random number between 0 and 1
		0---1/3---2/3---1
		0---1/3  ->rock
		1/3---2/3  ->paper
		2/3---1  ->scissors
		 --->
		<button onclick="
			playGame('rock');
		" class="move-button">
			<img src = "rock-emoji.png" class = "move-icon"> 
		</button>


		<button onclick="
			playGame('paper');
		" class="move-button">
			<img src = "paper-emoji.png" class = "move-icon"> 
		</button>
		

		<button onclick="
			playGame('scissors');
		" class="move-button">
			<img src = "scissors-emoji.png" class = "move-icon"> 
		</button>

		<p class = "js-result result"></p>
		<p class = "js-moves"></p>
		<p class = "js-score"></p>

		<button onclick="
			score.wins=0;
			score.losses=0;
			score.ties=0;
			localStorage.removeItem('score');
			updateScoreElement();
		" class="reset-score">
			Reset Score
		</button>

		<button class="auto-play-button" onclick="autoPlay();">Auto Play</button>
		

		<script src="ultimate-RPS-game.js"></script>
	</body>
</html>
